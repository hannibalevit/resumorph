services:
  server:
    build: ./server
    ports:
      # Bound to loopback only, not "8000:8000" (which Docker publishes on
      # every host interface) — secure by default, since this API has no
      # authentication of its own (see SECURITY.md's threat model). If you
      # genuinely need LAN access (e.g. running the backend on a separate
      # machine from the browser), override this in your own compose file
      # rather than loosening the shipped default.
      - "127.0.0.1:8000:8000"
    extra_hosts:
      # Lets the container reach Ollama (or other host services) via
      # host.docker.internal on Linux as well as Docker Desktop.
      - "host.docker.internal:host-gateway"
    volumes:
      - data:/data
    environment:
      DATABASE_URL: sqlite:////data/resumorph.db
      # The extension's chrome-extension://<id> origin is allowed independently
      # via the regex in app/main.py's CORSMiddleware, regardless of this
      # value — this only needs to cover browser-based dev (e.g. the side
      # panel's Vite dev server), so it matches app/config.py's own default
      # rather than opening CORS to "*".
      ALLOWED_ORIGINS: "http://localhost:5173"
      # Ollama on the host is not reachable at localhost from inside the
      # container. Prefer host.docker.internal; if Ollama only binds
      # 127.0.0.1 you must also set OLLAMA_HOST (see SECURITY.md / README).
      # Saved provider base_url wins over this env when non-NULL.
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
      # Optional: set API keys here, or configure them later in the extension Settings UI.
      # OPENAI_API_KEY: ""
      # ANTHROPIC_API_KEY: ""
      # GOOGLE_API_KEY: ""
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  data:

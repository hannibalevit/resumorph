<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upload Resume - Resume Tailor</title>
    <script type="module" crossorigin src="/assets/upload.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill.js">
    <link rel="modulepreload" crossorigin href="/assets/storage.js">
    <link rel="modulepreload" crossorigin href="/assets/resumeParser.js">
    <link rel="stylesheet" crossorigin href="/assets/upload.css">
  </head>
  <body>
    <main class="page">
      <section class="upload-panel">
        <header>
          <h1>Upload base resume</h1>
          <p id="statusText" class="status">Choose a resume file to store locally in Chrome.</p>
        </header>

        <label class="drop-zone" for="resumeFile">
          <span class="drop-title">Choose resume file</span>
          <span class="drop-hint">Supported formats: .txt, .md, .pdf, .doc, .docx</span>
        </label>
        <input
          id="resumeFile"
          type="file"
          accept=".txt,.md,.pdf,.doc,.docx,text/plain,text/markdown,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document"
        />

        <p id="errorBlock" class="message error hidden"></p>
        <section id="successBlock" class="message success hidden">
          <p>Resume uploaded and saved locally.</p>
          <p>You can close this tab and generate from the extension popup.</p>
        </section>
      </section>
    </main>
  </body>
</html>

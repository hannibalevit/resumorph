<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ResuMorph</title>
    <script type="module" crossorigin src="/assets/popup.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill.js">
    <link rel="modulepreload" crossorigin href="/assets/storage.js">
    <link rel="stylesheet" crossorigin href="/assets/popup.css">
  </head>
  <body>
    <main class="popup">
      <header class="header">
        <h1>ResuMorph</h1>
        <p id="resumeStatus" class="status">Checking resume…</p>
      </header>

      <section id="uploadPanel" class="panel">
        <button id="uploadButton" class="primary" type="button">Upload base resume</button>
        <p class="hint">Supported formats: .txt, .md, .pdf, .doc, .docx.</p>
      </section>

      <section id="actionsPanel" class="panel hidden">
        <button id="scanButton" type="button">Scan vacancy</button>
        <button id="generateButton" class="primary" type="button" disabled>Generate tailored resume</button>
        <div class="secondary-actions">
          <button id="replaceButton" type="button">Replace base resume</button>
          <button id="clearButton" type="button">Clear stored resume</button>
        </div>
      </section>

      <section id="previewPanel" class="panel hidden">
        <div class="meta-grid">
          <span>Title</span>
          <strong id="jobTitleText">Unknown</strong>
          <span>Company</span>
          <strong id="companyText">Unknown</strong>
          <span>Location</span>
          <strong id="locationText">Unknown</strong>
          <span>Source</span>
          <strong id="sourceText">-</strong>
          <span>Confidence</span>
          <strong id="confidenceText">-</strong>
          <span>Text length</span>
          <strong id="textLengthText">0</strong>
        </div>
        <textarea id="jobTextPreview" disabled></textarea>
        <button id="editButton" type="button">Edit extracted text</button>
      </section>

      <details id="debugPanel" class="debug hidden">
        <summary>Debug extraction</summary>
        <pre id="debugOutput"></pre>
      </details>

      <p id="loadingText" class="loading hidden">Generating resume…</p>
      <p id="scanLoadingText" class="loading hidden">Scanning vacancy…</p>
      <p id="errorBlock" class="message error hidden"></p>

      <section id="successBlock" class="message success hidden">
        <p>Tailored resume is ready.</p>
        <button id="downloadButton" class="primary" type="button">Download tailored resume</button>
      </section>
    </main>
  </body>
</html>

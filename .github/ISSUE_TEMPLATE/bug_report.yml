name: Bug report
description: Something in the extension or backend isn't working as expected.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please make sure this
        isn't a **security vulnerability** first — if it is, follow
        [SECURITY.md](../../SECURITY.md) instead of filing a public issue.

  - type: checkboxes
    id: privacy-check
    attributes:
      label: Privacy check
      description: >
        ResuMorph is local-first — resumes, job text, and API keys are
        sensitive. Please double-check before submitting.
      options:
        - label: >
            I have **not** included my real resume text, job posting
            content, API keys, or any `MASTER_ENCRYPTION_KEY`/`.env` contents
            in this report (use redacted or synthetic examples instead).
          required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Where does the bug happen?
      options:
        - Extension (side panel / content script / service worker)
        - Backend (FastAPI server)
        - Docker / infrastructure
        - Documentation
        - Not sure
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: LLM provider (if relevant)
      options:
        - OpenAI
        - Google Gemini
        - Anthropic Claude
        - Not using an LLM provider / local fallback
        - Not applicable
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        - OS:
        - Chrome/Chromium version:
        - Extension version (see chrome://extensions):
        - Backend: Docker (make up) / uvicorn --reload / other
        - Docker version (if applicable):
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: >
        `make logs` output, browser console output, or a screenshot.
        Please redact anything sensitive.
      render: shell
    validations:
      required: false

name: Auto Release

# Every push to main is treated as a release: derive the next semantic version
# from Conventional Commits since the last v* tag (feat -> minor, fix/other ->
# patch, a `!` or `BREAKING CHANGE:` footer -> major), tag it, generate a
# categorized changelog entry (git-cliff, config in cliff.toml) prepended to
# CHANGELOG.md, rebuild the version badge, and publish a GitHub Release with
# the built extension attached and the changelog entry as the release body.
# There is no manual "bump the version file" step - the tag history and
# CHANGELOG.md are the single source of truth, and this workflow is the only
# thing that writes to the version fields / CHANGELOG.md below.
# If there are no conventional commits since the last tag (e.g. only
# chore/ci/docs), no release is cut.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  GIT_CLIFF_VERSION: "2.13.1"

permissions:
  contents: read

concurrency:
  group: auto-release-main
  cancel-in-progress: false

jobs:
  # Skipped for the bump commit's own push so this doesn't trigger itself.
  # (In practice GitHub already won't start a new run for a GITHUB_TOKEN push,
  # but the guard keeps this workflow correct even if triggered manually or via
  # a PAT.)
  bump-version:
    name: Bump version, changelog & tag
    if: "github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'chore: bump version')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      released: ${{ steps.bump.outputs.released }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install git-cliff
        run: |
          curl -sL "https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/git-cliff-${GIT_CLIFF_VERSION}" >> "$GITHUB_PATH"

      - name: Compute next version, update changelog, bump files
        id: bump
        run: |
          git fetch --tags --force
          LAST_TAG=$(git tag -l 'v*.*.*' --sort=-v:refname | head -n1)
          LAST_TAG=${LAST_TAG:-v0.0.0}

          NEW_TAG=$(git-cliff --bumped-version 2>/dev/null)

          if [ "$NEW_TAG" = "$LAST_TAG" ]; then
            echo "No conventional commits since $LAST_TAG; nothing to release."
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NEW_VERSION=${NEW_TAG#v}
          echo "Bumping $LAST_TAG -> $NEW_TAG"

          jq --arg v "$NEW_VERSION" '.version = $v' extension/manifest.json > extension/manifest.json.tmp
          mv extension/manifest.json.tmp extension/manifest.json

          sed -i "0,/^version = \".*\"/s//version = \"$NEW_VERSION\"/" server/pyproject.toml

          # Create CHANGELOG.md with the standard Keep a Changelog header if it
          # doesn't exist yet (must match cliff.toml's [changelog].header
          # byte-for-byte - see the comment at the top of cliff.toml for why).
          if [ ! -f CHANGELOG.md ]; then
            cat > CHANGELOG.md <<'HEADER'
          # Changelog

          All notable changes to this project are documented in this file.

          The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
          and this project adheres to [Semantic Versioning](https://semver.org/).

          ## [Unreleased]

          HEADER
          fi

          # Prepend just this release's entry (commits since $LAST_TAG, not
          # yet tagged) into CHANGELOG.md.
          git-cliff --tag "$NEW_TAG" --unreleased --prepend CHANGELOG.md

          # Release-notes body for just this release, for the GitHub Release
          # (publish-release regenerates this from the pushed tag rather than
          # receiving it as an artifact).

          # Rebuild the committed extension/dist/ (documented as the no-Node-required
          # distribution) so it never drifts from the version/source it's tagged with.
          (cd extension && npm ci && npm run build)

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add extension/manifest.json extension/dist server/pyproject.toml CHANGELOG.md
          git commit -m "chore: bump version to $NEW_TAG [skip ci]"
          git tag -a "$NEW_TAG" -m "$NEW_TAG"

          # server-ci.yml's coverage-badge job can push its own commit to main
          # around the same time — retry with a rebase if we lose the race.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::Could not push version bump to main after 3 attempts"
              exit 1
            fi
            echo "Push rejected, rebasing onto latest main (attempt $attempt)"
            git fetch origin main
            git rebase origin/main
          done
          git push origin "$NEW_TAG"

          {
            echo "released=true"
            echo "version=$NEW_VERSION"
            echo "tag=$NEW_TAG"
          } >> "$GITHUB_OUTPUT"

  build-extension:
    name: Build extension artifact
    needs: bump-version
    if: needs.bump-version.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      # extension/dist/ is already built and committed as part of the tagged
      # commit (bump-version job), so this just packages it — no rebuild here,
      # which guarantees the release zip is byte-identical to what's in git.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.bump-version.outputs.tag }}

      - name: Zip built extension
        run: |
          cd extension/dist
          zip -r "../../resumorph-extension-${{ needs.bump-version.outputs.tag }}.zip" .

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: resumorph-extension-${{ needs.bump-version.outputs.tag }}.zip
          retention-days: 1

  publish-release:
    name: Publish GitHub Release
    needs: [bump-version, build-extension]
    if: needs.bump-version.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.bump-version.outputs.tag }}
          fetch-depth: 0

      - name: Install git-cliff
        run: |
          curl -sL "https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/git-cliff-${GIT_CLIFF_VERSION}" >> "$GITHUB_PATH"

      - name: Generate release notes for this release
        run: |
          git-cliff --tag ${{ needs.bump-version.outputs.tag }} --latest --strip all -o /tmp/release-notes.md

      - name: Download zip artifact
        uses: actions/download-artifact@v4
        with:
          name: extension-zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.bump-version.outputs.tag }}
          body_path: /tmp/release-notes.md
          files: resumorph-extension-${{ needs.bump-version.outputs.tag }}.zip

  # Self-contained badge (a plain file in the repo, not a live external image)
  # so it renders the same way for public and private repos alike, matching
  # the coverage badge in server-ci.yml.
  update-version-badge:
    name: Update version badge
    needs: [bump-version, publish-release]
    if: needs.bump-version.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      # server-ci.yml's coverage-badge job can push its own commit to main
      # while this workflow is still running — rebase before generating the
      # badge so the working tree is clean for git rebase and the commit
      # below doesn't get rejected as non-fast-forward.
      - name: Sync with latest main
        run: |
          git fetch origin main
          git rebase origin/main

      - name: Generate badge
        run: |
          curl -sfL "https://img.shields.io/badge/release-${{ needs.bump-version.outputs.tag }}-blue.svg" \
            -o .github/badges/version.svg

      - name: Commit badge if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update version badge to ${{ needs.bump-version.outputs.tag }} [skip ci]"
          file_pattern: ".github/badges/version.svg"
          branch: main
